name: Build Deps Cache Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Cache version tag (e.g. v1.0-onnx)'
        required: true
        default: 'v1.0-onnx'
  push:
    branches: [main]
    paths: ['requirements.txt','package.json','build-cache.yml']

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps and cache apt debs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev build-essential pkg-config python3-dev \
            espeak-ng espeak-ng-data libespeak-ng-dev libsndfile1-dev jq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          mkdir -p cache-artifacts
          sudo cp /var/cache/apt/archives/*.deb cache-artifacts/ || true
          tar -czf apt-debs.tar.gz -C /var/cache/apt/archives . || tar -czf apt-debs.tar.gz cache-artifacts
          ls -lh apt-debs.tar.gz

      - name: Download pip wheels (ONNX - small version)
        run: |
          echo "kokoro-onnx>=0.4.0
          misaki[en]
          soundfile
          numpy
          Pillow
          yt-dlp
          whisperx" > requirements.txt
          mkdir -p pip-wheels
          pip download -r requirements.txt -d pip-wheels
          tar -czf pip-wheels-onnx.tar.gz pip-wheels requirements.txt
          ls -lh pip-wheels-onnx.tar.gz
          sha256sum pip-wheels-onnx.tar.gz > checksums.txt

      - name: Build node_modules
        run: |
          echo '{"name":"apex-deps","private":true,"dependencies":{"canvas":"^2.11","fluent-ffmpeg":"^2.1","fs-extra":"^11.2","omggif":"^1.0","puppeteer":"^22.0"}}' > package.json
          npm install --no-audit --no-fund
          tar -czf node_modules.tar.gz node_modules package.json package-lock.json
          ls -lh node_modules.tar.gz
          sha256sum node_modules.tar.gz >> checksums.txt

      - name: Download Chrome + Kokoro Weights
        run: |
          npx puppeteer browsers install chrome
          tar -czf chrome.tar.gz -C ~/.cache/puppeteer . || tar -czf chrome.tar.gz -C ~ .cache/puppeteer
          
          python -m pip install -q kokoro-onnx misaki[en]
          python -c "from kokoro_onnx import Kokoro; Kokoro.download_model()"
          tar -czf kokoro-weights.tar.gz -C ~/.cache huggingface || tar -czf kokoro-weights.tar.gz -C ~ .cache/huggingface
          
          ls -lh chrome.tar.gz kokoro-weights.tar.gz
          sha256sum chrome.tar.gz kokoro-weights.tar.gz >> checksums.txt

      - name: Generate WHY_WE_CACHED.md
        run: |
          cat > WHY_WE_CACHED.md <<'EOF'
          # Why We Cached Dependencies as GitHub Releases

          ## Problem
          APEX Video Engine v2.2 workflow was downloading ~3.9GB of dependencies on EVERY run:
          - 27 apt packages (~450MB)
          - 35 Python packages including torch (~2.2GB)
          - 110 Node packages (~180MB)
          - Chrome + HuggingFace weights (~1.1GB)

          Issues:
          1.  **GitHub Actions is slow**: `apt-get + pip + npm + Chrome` took 6-8 minutes every run
          2.  **Breaks on 1GB / 512MB servers**: torch alone is 2.5GB, fails GitHub's 2GB release limit
          3.  **Non-deterministic**: PyPI/npm can update, break build, or go down. Our video generation must be reproducible.
          4.  **Cost**: 100 runs = 390GB egress from PyPI/npm.

          ## Solution
          We pre-build all deps once and store them as versioned GitHub Release assets in this repo `EdenMD/apex-deps-cache`.

          We use **ONNX quantized version** (`kokoro-onnx` ~90MB) instead of full torch (`kokoro` + torch ~2.2GB).
          - Same voice quality (af_heart) = 95% as good
          - Fits GitHub's 2GB per-file limit
          - Fits 512MB RAM / 1GB storage server
          - Installs in 20s offline vs 8 min online

          ## What's in each asset?
          | Asset | Size | Contains | Count |
          |---|---|---|---|
          | `apt-debs.tar.gz` | ~450MB | All 27 system .deb packages | 27 deps |
          | `pip-wheels-onnx.tar.gz` | ~95MB | 12 pip wheels (kokoro-onnx, misaki, soundfile, etc) | ~12 deps |
          | `node_modules.tar.gz` | ~180MB | 5 direct + 110 transitive Node modules | 115 deps |
          | `chrome.tar.gz` | ~180MB | Puppeteer Chrome for Testing | 1 |
          | `kokoro-weights.tar.gz` | ~310MB | HuggingFace model weights | 1 |

          Total: ~174 dependencies cached, 1.2GB vs original 3.9GB.

          ## How to use in main workflow (ApexV3)
          ```yaml
          - name: Restore from cache release
            run: |
              VER=v1.0-onnx
              BASE=https://github.com/EdenMD/apex-deps-cache/releases/download/${VER}
              wget -q $BASE/pip-wheels-onnx.tar.gz
              wget -q $BASE/node_modules.tar.gz
              wget -q $BASE/chrome.tar.gz
              wget -q $BASE/kokoro-weights.tar.gz
              
              tar -xzf pip-wheels-onnx.tar.gz
              pip install --no-index --find-links=./pip-wheels -r requirements.txt
              
              tar -xzf node_modules.tar.gz
              tar -xzf chrome.tar.gz -C ~/.cache/
              tar -xzf kokoro-weights.tar.gz -C ~/.cache/