name: Save MD Files from Source Repo

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repo to clone, example: EdenMD/ApexV3'
        required: true
        default: 'EdenMD/ApexV3'
      source_branch:
        description: 'Branch to clone from'
        required: false
        default: 'main'

jobs:
  save-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout source repo using PAT
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.source_repo }}
          token: ${{ secrets.PRIVATE_SRC_PAT }}
          ref: ${{ github.event.inputs.source_branch }}
          path: source-repo
          fetch-depth: 1

      - name: Create documentation folder if it doesn't exist
        shell: bash
        run: |
          mkdir -p documentation
          echo "✅ Documentation folder ready"

      - name: Copy all markdown files into documentation folder
        shell: bash
        run: |
          TARGET_DIR="documentation"

          echo "Searching for .md files in source repo..."
          COUNT=0

          while IFS= read -r file; do
            rel_path="${file#source-repo/}"
            dest="$TARGET_DIR/$rel_path"

            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"

            echo "✓ Copied: $rel_path"
            COUNT=$((COUNT + 1))
          done < <(find source-repo -type f -iname "*.md" | sort)

          echo ""
          echo "📊 Total .md files copied: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No .md files found in source repo"
            exit 1
          fi

      - name: Show all files in documentation folder
        shell: bash
        run: |
          echo "📁 Files in documentation/:"
          find documentation -type f -iname "*.md" | sort
          echo ""
          echo "📈 Total: $(find documentation -type f -iname "*.md" | wc -l)"

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git status --porcelain | grep -q .; then
            git add documentation
            git commit -m "docs: add markdown files from ${{ github.event.inputs.source_repo }}"
            git push
            echo "✅ Changes pushed successfully"
          else
            echo "ℹ️ No changes to commit"
          fi